name: Auto-actualizar versión del Service Worker

on:
  push:
    paths:
      - 'index.html'

jobs:
  update-sw-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Inyectar versión en index.html y sw.js
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          echo "Versión: $VERSION"
          
          # Actualizar sw.js
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$VERSION'/" sw.js
          
          # Inyectar meta refresh con version en index.html
          # Reemplaza el marcador de versión si existe, o agrega uno nuevo
          if grep -q 'data-build-version' index.html; then
            sed -i "s/data-build-version=\"[^\"]*\"/data-build-version=\"$VERSION\"/" index.html
          else
            sed -i "s|<meta charset=\"UTF-8\"/>|<meta charset=\"UTF-8\"/>\n<meta name=\"build-version\" content=\"$VERSION\" data-build-version=\"$VERSION\"/>|" index.html
          fi

      - name: Confirmar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html
          git diff --staged --quiet || git commit -m "build: versión $(date +%Y%m%d%H%M%S)"
          git push
