name: Auto-actualizar versión del Service Worker

on:
  push:
    paths:
      - 'index.html'  # Solo se activa cuando cambia index.html

jobs:
  update-sw-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar versión en sw.js
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$VERSION'/" sw.js
          echo "Nueva versión: $VERSION"

      - name: Confirmar cambio en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --staged --quiet || git commit -m "chore: auto-actualizar SW versión $(date +%Y%m%d%H%M%S)"
          git push
